name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ruff
        run: pip install ruff

      - name: Verifier le code
        run: ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer torch (variante CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Installer les dependances
        run: pip install -r requirements.txt pytest httpx

      # Aucun acces reseau : conftest.py monte un classifieur factice et pointe
      # l'API dessus. Le banc de detection, lui, se saute tout seul faute de
      # poids fine-tunes.
      - name: Lancer les tests
        run: pytest -v

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t llm-sentinel:ci .

      # L'image ne contient pas les poids fine-tunes (exclus de Git). On fabrique
      # un modele factice avec les outils deja presents dans l'image, puis on le
      # monte : la CI ne depend ainsi d'aucun telechargement HuggingFace.
      - name: Fabriquer un modele factice
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v sentinel-models:/modeles \
            -w /src \
            llm-sentinel:ci python modele_factice.py /modeles

      - name: Demarrer le conteneur
        run: |
          docker run -d --name sentinel -p 8000:8000 \
            -v sentinel-models:/modeles \
            -e SENTINEL_MODEL_DIR=/modeles \
            llm-sentinel:ci
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "API operationnelle apres ${i} tentatives"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas repondu dans les temps"
          docker logs sentinel
          exit 1

      - name: Verifier que le dashboard repond
        run: curl -sf http://localhost:8000/dashboard | grep -q "LLM Sentinel"

      - name: Verifier que l'API annonce bien un modele entraine
        run: curl -sf http://localhost:8000/ | grep -q '"fine_tuned":true'
